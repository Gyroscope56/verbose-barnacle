name: LPR checks
on:
  pull_request:
    paths: ['ml/lpr/**', '.github/workflows/lpr-tests.yml']
  push:
    branches: [main]
    paths: ['ml/lpr/**', '.github/workflows/lpr-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/lpr
    env:
      YOLO_CONFIG_DIR: ${{ github.workspace }}/ml/lpr/.cache/ultralytics
      MPLCONFIGDIR: ${{ github.workspace }}/ml/lpr/.cache/matplotlib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/lpr/pyproject.toml
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: parksight assets
      - run: pytest -q
      - run: ruff check src tests
      - run: ruff format --check src tests
