[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parksight-ml"
version = "0.1.0"
description = "Synthetic license plate detection and recognition baseline"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pillow>=11,<13", "opencv-python>=4.10,<5", "torch>=2.8,<3", "torchvision>=0.23,<1", "ultralytics>=8.3,<9", "pyyaml>=6,<7", "certifi>=2025"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
export = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.3"]

[project.scripts]
parksight = "parksight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
